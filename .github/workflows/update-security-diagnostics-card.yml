name: Update Security Diagnostics Card

on:
  schedule:
    # Refresh at 12:00 AM, 8:00 AM, and 4:00 PM Eastern Time.
    - cron: "0 0,8,16 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate_security_diagnostics_card.py"
      - ".github/workflows/update-security-diagnostics-card.yml"

permissions:
  contents: write

concurrency:
  group: security-diagnostics-card
  cancel-in-progress: false

jobs:
  update-card:
    name: Generate Security Diagnostics Card
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Dynamic Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: DRA3V50
          CARD_OUTPUT: assets/security-research-diagnostics.svg
        run: python scripts/generate_security_diagnostics_card.py

      - name: Commit Updated Card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/security-research-diagnostics.svg

          if git diff --staged --quiet; then
            echo "Security diagnostics card is already current."
          else
            git commit -m "Update security diagnostics card"
            git push
          fi
